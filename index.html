<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171126"><link rel="manifest" href="manifest.webmanifest"><title>Retro Planner ’86</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#3d194b,#100d20 65%);color:#f9eff9;min-height:100dvh}.app{max-width:670px;margin:auto;padding:24px 17px 80px}header{border:2px solid #ff49b3;box-shadow:0 0 16px #ff49b355,inset 0 0 14px #ff49b322;border-radius:20px;padding:22px;margin-bottom:22px}small{color:#fbb777;letter-spacing:.15em}h1{margin:8px 0;font-size:29px;color:#fff}p{color:#bcb1ca;font-size:13px}.tabs,.days{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tabs button,.days button,button.reset{background:#271b37;color:#e8dceb;border:1px solid #8c568d;border-radius:12px;padding:11px 15px;white-space:nowrap;font-weight:700}.tabs button.active,.days button.active{border-color:#00e5ff;color:#00e5ff;box-shadow:0 0 10px #00e5ff44}.days{margin:16px 0}section{margin:20px 0;border:1px solid #543456;background:#1d162d;border-radius:17px;padding:17px;box-shadow:0 0 12px #ff49b311}h2{font-size:14px;color:#ffb76c;letter-spacing:.12em;margin:0 0 12px}.task{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid #392b49;line-height:1.45;font-size:15px}.task:last-child{border:0}.task input{accent-color:#00e5ff;min-width:21px;width:21px;height:21px;margin:0}.task:has(input:checked) span{color:#9b8ca8;text-decoration:line-through}.progress{height:9px;background:#3b2c4c;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff49b3,#00e5ff);transition:width .2s}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:12px;color:#b7a8c6}button{cursor:pointer}button.reset{border-color:#ff8f63;color:#ffb37d;width:100%;margin-top:12px}footer{text-align:center;font-size:12px;color:#998ba7;margin-top:20px}#authForm input{display:block;width:100%;background:#271b37;color:white;border:1px solid #8c568d;border-radius:9px;padding:12px;margin:7px 0 14px}#authForm button,#logout{background:#281b38;color:#00e5ff;border:1px solid #00e5ff;border-radius:10px;padding:11px 14px}#authForm label{font-size:13px;color:#f9eff9}#syncStatus{padding:10px 0} [hidden]{display:none!important}</style></head><body><div class="app"><header><small>RETRO CONTROL HUB ’86</small><h1>MEIN STRUKTURPLAN</h1><p>Sieben Tage · Neon Edition · Tageswechsel 06:30 Uhr</p><div class="row"><strong id="date"></strong><strong id="count" style="color:#00e5ff"></strong></div><div class="progress" style="margin-top:12px"><div class="bar" id="bar"></div></div></header><section id="authForm"><h2>CLOUD LOGIN</h2><form onsubmit="login(event)"><label>E-Mail<input id="email" type="email" autocomplete="username" required></label><label>Passwort<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">ANMELDEN</button></form></section><div class="row"><span id="syncStatus" class="muted">Bitte anmelden</span><button id="logout" hidden onclick="logout()">ABMELDEN</button></div><div id="planner" hidden><div class="tabs"><button id="weekday" onclick="chooseGroup('weekday')">MO – FR</button><button id="weekend" onclick="chooseGroup('weekend')">SA – SO</button></div><nav class="days" id="days"></nav><main id="tasks"></main><button class="reset" onclick="resetCurrent()">↻ DIESEN TAG ZURÜCKSETZEN</button><footer>Cloud-Speicherung aktiv · Rainmeter-Anbindung folgt.<br>Zum Abhaken ist derzeit eine Internetverbindung erforderlich.</footer></div></div><script src="app.js"></script></body></html>
